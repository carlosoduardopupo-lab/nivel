<title>Nivel prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna de teléfono (máx. 440px) centrada; cada pantalla scrollea dentro; hojas inferiores y avisos flotantes encima. */
:root{
  --bg:#FAF7F8; --surface:#FFFFFF; --surface2:#F2ECEF; --fg:#1E171B; --muted:#75666E; --line:#E5DBE0;
  --rosa:#D4537E; --naranja:#EF9F27; --verde:#1A8F6A; --rojo:#D9443F; --oro:#F2B33D; --oroTxt:#4A2F02;
  --ink:#2A2126; --ink2:#43373E; --onink:#FFFFFF; --scrim:rgba(20,12,16,.55);
  --grad:linear-gradient(135deg,var(--rosa),var(--naranja));
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F12; --surface:#1C171A; --surface2:#2A2227; --fg:#F4EEF1; --muted:#A8999F; --line:#3A3036;
  --verde:#3FBF92; --rojo:#F06560; --ink:#2D2429; --ink2:#463A41; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F12; --surface:#1C171A; --surface2:#2A2227; --fg:#F4EEF1; --muted:#A8999F; --line:#3A3036;
  --verde:#3FBF92; --rojo:#F06560; --ink:#2D2429; --ink2:#463A41; --scrim:rgba(0,0,0,.65); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rosa);outline-offset:2px;border-radius:8px}
input,textarea{font:inherit;color:var(--fg)}
p{margin:0}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:480px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 8px}
.top h1{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.iconbtn:active{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hearts{display:inline-flex;gap:2px;color:var(--rojo);font-size:15px}
.hearts .off{color:var(--muted);opacity:.45}
.btn{display:flex;width:100%;height:50px;border-radius:14px;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;text-align:center}
.btn.grad{background:var(--grad);color:#fff}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.soft{background:var(--surface2);color:var(--fg)}
.btn.off{background:var(--surface2);color:var(--muted);cursor:default}
.btn.danger{background:var(--rojo);color:#fff}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px}
.h2{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
.sub{font-size:14px;color:var(--muted);margin-top:6px}
.field{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;min-height:48px;border:1.5px solid transparent}
.field:focus-within{border-color:var(--fg)}
.field input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--fg)}
textarea.field{display:block;width:100%;padding:12px;min-height:76px;resize:none;outline:none;line-height:1.4}
::placeholder{color:var(--muted);opacity:.85}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg)}
.seg{display:flex;gap:6px}
.seg button{flex:1;text-align:center;padding:9px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.fab{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--grad);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(212,83,126,.42);z-index:5}
.fab:active{transform:translateX(-50%) scale(.94)}
/* feed */
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:4px 14px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.card{background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:block;width:100%}
.card + .card{margin-top:14px}
.card .img{position:relative;height:190px;overflow:hidden}
.card .tag{position:absolute;top:10px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.card .body{padding:12px 14px 14px}
.card .row{display:flex;align-items:center;gap:10px}
.card .name{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.follow{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--fg);color:var(--bg)}
.follow.on{background:var(--surface2);color:var(--fg)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--muted);align-items:center}
.diff{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--grad);border-radius:3px}
.bar.done > i{background:var(--verde)}
/* trivia */
.reel{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.thumb{position:relative;width:50px;height:50px;border-radius:12px;overflow:hidden;flex:none;border:2px solid transparent}
.thumb.cur{border-color:var(--rosa)}
.thumb .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;background:rgba(0,0,0,.18)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:3/4.1;border-radius:20px;overflow:hidden;background:var(--surface2)}
.stage .art{position:absolute;inset:0;transition:filter .5s ease,transform .5s ease}
.stage .art.blur{filter:blur(18px);transform:scale(1.12)}
.overlay{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 14px;background:linear-gradient(to top,rgba(18,10,14,.88),rgba(18,10,14,.62) 70%,rgba(18,10,14,0));color:#fff}
.q{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.timer{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;margin:12px 0}
.timer i{display:block;height:100%;width:100%;background:var(--naranja);border-radius:3px;transition:width 1s linear}
.opt{display:block;width:100%;height:48px;border-radius:14px;background:rgba(255,255,255,.94);color:#21171C;font-weight:600;text-align:center;font-size:15px}
.opt + .opt{margin-top:8px}
.opt:active{transform:scale(.98)}
.paybtn{margin-top:12px;height:48px;border-radius:14px;background:var(--oro);color:var(--oroTxt);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.side{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff}
.side button{width:50px;height:50px;border-radius:50%;background:rgba(20,14,18,.45);border:1px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.side small{display:block;text-align:center;font-size:12px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.side .liked{background:var(--rosa);border-color:var(--rosa)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.nudge svg{animation:nudge 1.1s ease-in-out infinite}
.reveal{position:absolute;left:14px;right:14px;top:16px;background:rgba(20,14,18,.72);border-radius:14px;padding:12px;text-align:center;color:#fff;transition:opacity 1.8s ease}
.dots{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(20,14,18,.4);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:2}
/* perfil */
.stat{flex:1;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.wallet{border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--onink)}
.wallet small{font-size:11px;letter-spacing:.06em;opacity:.7;font-weight:700}
.wallet .num{font-family:var(--f-display);font-size:26px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.wbtn{flex:1;height:38px;border-radius:11px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)) + 0px)}
.cell{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface2);max-width:100%}
.cell::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 45%);pointer-events:none}
.cell .c{position:absolute;z-index:1;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;gap:3px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.ava{border-radius:50%;overflow:hidden;flex:none}
/* listas ajustes */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 0}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.item .ib{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:14px}
.item .t span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--grad)}
.sw.on::after{transform:translateX(18px)}
/* tienda */
.pack{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);width:100%}
.pack.on{border-color:var(--rosa)}
.coin{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--oro),#F8D27A);color:var(--oroTxt);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ribbon{position:absolute;top:-10px;right:14px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:999px}
.line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums}
.quick{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2)}
.quick.on{background:var(--fg);color:var(--bg)}
/* hoja y aviso */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto;animation:up .24s ease}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;padding:10px 16px;border-radius:999px;z-index:30;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.paso{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <main id="view" class="screen"></main>
  <div id="scrim" class="scrim" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
/* ---------- iconos ---------- */
const P={
 back:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>', x:'<path d="M18 6L6 18M6 6l12 12"/>', check:'<path d="M20 6L9 17l-5-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
 heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M14.6 9.4c-.5-.9-1.5-1.4-2.6-1.4-1.5 0-2.6.8-2.6 2s1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2.1-.5-2.6-1.4M12 6.5V8M12 16v1.5"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12Z"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 dots:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.5"/>',
 photo:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
 video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3Z"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
 flag:'<path d="M5 21V4M5 4h13l-2.5 4.5L18 13H5"/>', bank:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
 out:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/>', alert:'<path d="M12 3l10 18H2Z"/><path d="M12 10v4M12 17.5v.5"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', up:'<path d="M7 17L17 7M8 7h9v9"/>', pencil:'<path d="M4 20h4L19 9l-4-4L4 16Z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6Z"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>', receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/>',
 file:'<path d="M14 3H6v18h12V7Z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>', help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.5v.5"/>',
 book:'<path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4ZM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6Z"/>', grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4ZM10 20a2 2 0 0 0 4 0"/>', play:'<path d="M7 5l12 7-12 7Z"/>', trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0ZM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4"/>'
};
function ic(n,fill){return `<svg class="ico" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="${fill?0:2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`}

/* ---------- ilustraciones ---------- */
function art(theme,bg,o={}){
 let s=`<rect width="300" height="400" fill="${bg}"/>`;

    else if(failedToday) inner=`<p style="text-align:center;font-weight:700;font-size:16px;color:#FFB1AE">${ic('x')} ${f.msg||'Respuesta incorrecta'}</p><p style="text-align:center;font-size:13px;opacity:.85;margin-top:4px">${S.lives?`Te quedan ${S.lives} ${S.lives===1?'vida':'vidas'} hoy.`:'Te quedaste sin vidas.'} Mañana tendrás otra pregunta (intento ${f.count+1} de 3).</p>`;
    else if(noLives) inner=`<p style="text-align:center;font-weight:700;font-size:16px">Te quedaste sin vidas</p><p style="text-align:center;font-size:13px;opacity:.85;margin-top:4px">Vuelven en <b id="cd" style="font-variant-numeric:tabular-nums">${fmtLeft(S.livesAt-Date.now())}</b></p><button class="btn soft" data-go="tienda" style="margin-top:12px;height:44px;background:rgba(255,255,255,.14);color:#fff">Conseguir monedas</button>`;

    st.innerHTML=`<div class="art blur">${lvlArt(c,idx)}</div>${dots}<div class="overlay">${inner}<button class="paybtn" id="pay">${payTxt}</button></div>`;

    $('#pay').onclick=()=>pay(l);

    if(!noLives&&!failedToday&&!usedAll){
     st.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(+b.dataset.o));
     const total=tiempoDe(l.p);let s=total;
     requestAnimationFrame(()=>{const tb=$('#tb');if(tb)tb.style.width='100%'});
     timer=setInterval(()=>{s--;const tb=$('#tb');if(tb)tb.style.width=Math.max(0,s/total*100)+'%';if(s<=0){clearInterval(timer);answer(-1)}},1000);
    }
   }
   const r=$('#rep'); if(r) r.onclick=report;
  }
  function answer(i){
   if(locked)return;locked=true;clearInterval(timer);
   const l=c.levels[idx];
   if(i===l.a){c.progress++;toast('¡Acertaste! La foto es tuya');paint();return}
   S.lives=Math.max(0,S.lives-1); if(S.lives===0) S.livesAt=Date.now()+24*3.6e6;
   const prev=c.fails[idx]||{count:0};c.fails[idx]={count:prev.count+1,today:true,msg:i===-1?'Se acabó el tiempo':'Respuesta incorrecta'};

    <div style="display:flex;gap:8px;margin-top:10px"><div class="field" style="flex:1"><input id="ct" maxlength="140" placeholder="Escribe un comentario" aria-label="Comentario"></div><button class="iconbtn" id="cs" style="background:var(--fg);color:var(--bg);width:48px;height:48px" aria-label="Enviar">${ic('arrow')}</button></div>
    <p id="ce" style="font-size:12px;color:var(--rojo);margin-top:6px" hidden>Escribe algo antes de enviar.</p>`,sh=>{
     sh.querySelector('#cs').onclick=()=>{const v=sh.querySelector('#ct').value.trim();if(!v){sh.querySelector('#ce').hidden=false;return}l.comments.push({u:S.user,t:v});draw();paint()}});
   draw();
  }
  function report(){
   const m=['Contenido inapropiado','Parece una persona menor de edad','Foto robada o sin permiso','La respuesta es incorrecta','Otro motivo'];let sel=-1;
   openSheet(`<p style="font-family:var(--f-display);font-weight:700;font-size:18px">Reportar esta foto</p><p class="sub" style="margin-bottom:10px">Tu reporte es anónimo. Revisamos cada caso.</p>
    <div id="mot">${m.map((t,i)=>`<button class="item" data-m="${i}" role="radio" aria-checked="false" style="padding:12px 4px"><span class="t"><b>${t}</b></span><span class="rd" style="width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none"></span></button>`).join('')}</div>
    <button class="btn off" id="send" style="margin-top:12px">Enviar reporte</button>`,sh=>{
     sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sel=+b.dataset.m;sh.querySelectorAll('[data-m]').forEach(x=>{const on=+x.dataset.m===sel;x.setAttribute('aria-checked',on);x.querySelector('.rd').style.cssText=`width:22px;height:22px;border-radius:50%;flex:none;border:${on?'7px solid var(--rosa)':'2px solid var(--line)'}`});sh.querySelector('#send').className='btn danger'});
     sh.querySelector('#send').onclick=()=>{if(sel<0)return;closeSheet();toast('Reporte enviado. Gracias.')}});

    <p class="lbl">Nombre real</p><div class="field"><input data-f="name" placeholder="Nombre y apellido" aria-label="Nombre real" value="${d.name}"></div>
    <p class="lbl">Fecha de nacimiento</p><div style="display:flex;gap:8px"><div class="field" style="flex:1"><input data-f="dd" inputmode="numeric" maxlength="2" placeholder="DD" aria-label="Día" style="text-align:center" value="${d.dd}"></div><div class="field" style="flex:1"><input data-f="mm" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Mes" style="text-align:center" value="${d.mm}"></div><div class="field" style="flex:1.4"><input data-f="aa" inputmode="numeric" maxlength="4" placeholder="AAAA" aria-label="Año" style="text-align:center" value="${d.aa}"></div></div>
    <p id="ag" style="font-size:12px;color:var(--muted);margin:8px 2px 0">Debes tener 18 años o más.</p>
    <button id="tm" role="checkbox" aria-checked="${d.terms}" style="display:flex;gap:10px;align-items:flex-start;margin-top:18px;width:100%"><span id="tb" style="width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;${d.terms?'background:var(--grad)':'border:2px solid var(--muted)'}">${d.terms?ic('check'):''}</span><span style="font-size:13px;line-height:1.4">Confirmo que soy mayor de edad y acepto los <u>Términos</u> y la <u>Política de privacidad</u>.</span></button></div>`,
   ()=>`<div class="paso"><p class="h2">Tu perfil público</p><p class="sub">Es lo único que verán los demás.</p>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px"><button id="pa" class="ava" style="width:104px;height:104px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted)" aria-label="Elegir foto de perfil">${av?myAv():ic('camera')}</button><span style="font-size:13px;font-weight:700;color:var(--rosa)">Elegir foto</span></div>
    <p class="lbl">Nombre de usuario</p><div class="field"><span style="color:var(--muted)">@</span><input data-f="user" maxlength="20" placeholder="tu_nombre" autocomplete="off" aria-label="Nombre de usuario" value="${d.user}"><span id="ui"></span></div>
    <p id="um" style="font-size:12px;color:var(--muted);margin:6px 2px 0">Letras, números y guion bajo.</p></div>`,
   ()=>`<div class="paso"><p class="h2">¿Qué te gusta?</p><p class="sub" id="ic" style="margin-bottom:16px">Elige al menos 3. Lo usamos para sugerirte creadores.</p><div style="display:flex;flex-wrap:wrap;gap:8px">${INTERESES.map(t=>`<button class="chip ${sel.has(t)?'on':''}" data-in="${t}">${t}</button>`).join('')}</div></div>`,
   ()=>`<div class="paso" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:60px"><div style="padding:3px;border-radius:50%;background:var(--grad)"><div class="ava" style="width:96px;height:96px;border:3px solid var(--bg)">${myAv()}</div></div><p class="h2" style="margin-top:16px">¡Listo, @${d.user}!</p><p class="sub">Tienes 3 vidas para empezar.</p><div style="font-size:26px;margin-top:10px">${'<span class="hearts" style="font-size:26px;gap:6px">'+[0,1,2].map(()=>ic('heart',1)).join('')+'</span>'}</div></div>`
  ];
  const ok=()=>{
   if(step===0)return /^\S+@\S+\.\S+$/.test(d.mail)&&d.pass.length>=8;
   if(step===1){const e=age(),g=$('#ag');if(g){if(e===null){g.textContent='Debes tener 18 años o más.';g.style.color='var(--muted)'}else if(e<18){g.textContent='Lo sentimos, debes tener 18 años o más para usar la app.';g.style.color='var(--rojo)'}else{g.textContent='Edad confirmada';g.style.color='var(--verde)'}}return d.name.trim().length>=3&&e!==null&&e>=18&&d.terms}
   if(step===2){const v=d.user.trim().toLowerCase();let u=true,t='Disponible';if(!v){u=false;t='Letras, números y guion bajo.'}else if(v.length<3){u=false;t='Mínimo 3 caracteres'}else if(!/^[a-z0-9_]+$/.test(v)){u=false;t='Solo letras, números y guion bajo'}else if(CREATORS.some(c=>c.id===v)||v==='admin'){u=false;t='Ese nombre ya está en uso'}
    const m=$('#um');if(m){m.textContent=t;m.style.color=!v?'var(--muted)':u?'var(--verde)':'var(--rojo)';$('#ui').innerHTML=v?`<span style="color:${u?'var(--verde)':'var(--rojo)'}">${ic(u?'check':'x')}</span>`:''}return u&&av}
   if(step===3){const c=$('#ic');if(c)c.textContent=sel.size>=3?`${sel.size} elegidos · puedes elegir más`:'Elige al menos 3. Lo usamos para sugerirte creadores.';return sel.size>=3}
   return true};
  const btn=()=>{const b=$('#rn'),o=ok();b.className='btn '+(o?'grad':'off');b.textContent=step===4?'Empezar a jugar':step===3?'Terminar':'Continuar'};
  const draw=()=>{
   $('#bars').innerHTML=step<4?[0,1,2,3].map(i=>`<span style="flex:1;height:4px;border-radius:2px;background:${i<=step?'var(--grad)':'var(--surface2)'}"></span>`).join(''):'';
   $('#rb').style.visibility=step>0&&step<4?'visible':'hidden';
   $('#rs').innerHTML=V[step]();
   $('#rs').querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{d[i.dataset.f]=i.value;btn()});
   $('#rs').querySelectorAll('[data-soc]').forEach(b=>b.onclick=()=>{d.mail='usuario@gmail.com';d.pass='xxxxxxxx';step=1;draw()});
   const tm=$('#tm');if(tm)tm.onclick=()=>{d.terms=!d.terms;draw()};
   const pa=$('#pa');if(pa)pa.onclick=()=>{av=true;S.avIdx=(S.avIdx+1)%AVBG.length;draw()};
   $('#rs').querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{const t=b.dataset.in;sel.has(t)?sel.delete(t):sel.add(t);b.classList.toggle('on');btn()});
   btn();};
  $('#rn').onclick=()=>{if(!ok())return;if(step<4){step++;draw()}else{S.user=d.user.trim().toLowerCase();S.interests=new Set(sel);S.lives=3;feedFilter='Para ti';reset('feed')}};
  $('#rb').onclick=()=>{if(step>0){step--;draw()}};
  draw();
 }
};

/* arranque */
(function(){let h='';try{h=(location.hash||'').slice(1)}catch(e){}
 if(['perfil','crear','tienda','retiro','ajustes'].includes(h)) stack.push({n:h,p:{}});
 else if(h==='registro') stack=[{n:'registro',p:{}}];
 render();})();
</script>
